description: Complete short, bounded jobs with clear acceptance criteria, including diagnostics, extraction, mechanical edits, a few tool steps, or a targeted repository lookup. Use ds/deepseek-flash for large fan-out batches. Not for ambiguous features, sustained implementation, or complex code understanding.
