description: Non-mutating review of scoped changes or existing code for demonstrable correctness and security defects, with severity, location, impact, and the smallest local repair or removal. Spawn at least two reviewers in parallel and merge their findings, ranking issues both report highest. One reviewer uses a model family different from the author's. Not for implementing fixes, style quotas, or speculative abstractions.
models:
  - codex/gpt-6.1-sol
  - claude/opus-5.5
  - ds/deepseek-flash
  - gemini/gemini-4-carbon
  - codex/gpt-6-astra
  - xai/grok-4.6
thinkingLevel: low
tools:
  allow:
    - read
    - bash
    - grep
    - find
    - ls
    - codemode
    - fffind
    - ffgrep
    - agent_update
    - agent_pause
