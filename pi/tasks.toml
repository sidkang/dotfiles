["pi:install"]
description = "Install only pi dependencies; no deployment or setup"
run = "brew bundle install --no-upgrade --file=\"{{ config_root }}/pi/Brewfile\""

["pi:plan"]
description = "Preview only pi deployment"
run = "mise dot apply --dry-run \"~/.config/pi/agent\" \"~/.config/pi/agent/mcp.json\" \"~/.config/pi/agent/prompts\" \"~/.config/pi/agent/subagent-manager\" \"~/.config/pi/agent/themes\""

["pi:apply"]
description = "Deploy only pi configuration; no installation or setup"
run = "mise dot apply \"~/.config/pi/agent\" \"~/.config/pi/agent/mcp.json\" \"~/.config/pi/agent/prompts\" \"~/.config/pi/agent/subagent-manager\" \"~/.config/pi/agent/themes\""

["pi:extensions"]
description = "Explicitly update Pi extensions; may run npm lifecycle scripts"
confirm = "Update Pi extensions and their npm dependencies?"
run = "PI_CODING_AGENT_DIR=\"$HOME/.config/pi/agent\" pi update --extensions"
