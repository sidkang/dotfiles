# Shared setup for Bat and Starship. Keep unrelated global settings separate.
min_version = "2026.10.13"

[settings.history]
sync = "manual"

[bootstrap.packages]
"brew:bat" = { os = "macos" }
"brew:starship" = { os = "macos" }

[dotfiles]
"~/.config/bat" = { mode = "track" }
"~/.config/starship.toml" = { mode = "track" }
"~/.config/mise/conf.d/dotfiles.toml" = { mode = "track" }
"~/.config/mise/dotfiles" = { mode = "track" }

[tasks.bootstrap]
description = "Build the Bat theme cache"
run = "bat cache --build"
