config-version = 2

# You can use it to add commands that run after login to macOS user session.
# 'start-at-login' needs to be 'true' for 'after-login-command' to work
# Available commands: https://nikitabobko.github.io/AeroSpace/commands
after-login-command = []

# You can use it to add commands that run after AeroSpace startup.
# 'after-startup-command' is run after 'after-login-command'
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  'exec-and-forget borders active_color=0xffFFB26F width=4.0 blacklist="iPhone Mirroring"',
]

# Start AeroSpace at login
start-at-login = true

auto-reload-config = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 40

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
key-mapping.preset = 'qwerty'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "Q", "W", "E", "A", "S", "D", "T"]

# /bin/sh + Hammerspoon IPC: roughly 3x cheaper than fish -c + open.
# The hotkey block sits behind file tests, so non-keep mode costs nothing.
# `read` is a shell builtin on purpose: AeroSpace runs this hook with a PATH
# that has no /bin, so `cat` is not available here.
exec-on-workspace-change = ["/bin/sh", "-c", '''
url="notify?msg=$AEROSPACE_FOCUSED_WORKSPACE&level=info"
"$HOME/.local/bin/hs" -q -c "hsurl(\"$url\")" || open -g "hammerspoon://$url"
state="$HOME/.local/state/aerospace"
if [ -f "$state/hotkey-keep" ] && [ ! -f "$state/hotkey-hidden" ] && [ -f "$state/hotkey-id" ]; then
  hotkey_id=""
  read -r hotkey_id < "$state/hotkey-id"
  if [ -n "$hotkey_id" ]; then
    /opt/homebrew/bin/aerospace eval "move-node-to-workspace --window-id $hotkey_id $AEROSPACE_FOCUSED_WORKSPACE" >/dev/null 2>&1
    printf '%s' "$AEROSPACE_FOCUSED_WORKSPACE" > "$state/hotkey-ws"
  fi
fi
''']

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors

[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 5
outer.bottom = 3
outer.top = 10
outer.right = 5

[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:${PATH}'

[workspace-to-monitor-force-assignment]
1 = ["LG", "main"]
2 = ["LG", "main"]
3 = ["LG", "main"]
4 = ["secondary", "main"]
5 = ["secondary", "main"]

[[on-window-detected]]
if.app-id = "com.tencent.xinWeChat"
if.window-title-regex-substring = '^WeChat$'
check-further-callbacks = false
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-id = "ru.keepcoder.Telegram"
run = "move-node-to-workspace 1"

[[on-window-detected]]
if.app-id = "com.google.Chrome"
if.during-aerospace-startup = true
run = "move-node-to-workspace 2"

[[on-window-detected]]
if.app-id = "com.electron.logseq"
if.during-aerospace-startup = true
run = "move-node-to-workspace 4"

[[on-window-detected]]
if.app-id = "md.obsidian"
run = "move-node-to-workspace Q"

[[on-window-detected]]
if.app-id = "com.openai.chat"
run = "move-node-to-workspace W"

[[on-window-detected]]
if.app-id = "com.tencent.xinWeChat"
run = "layout floating"

[[on-window-detected]] # orbstack
if.app-id = "dev.kdrag0n.MacVirt"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apple.ScreenContinuity"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.getdropbox.dropbox"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apphousekitchen.aldente-pro"
run = "layout floating"

[[on-window-detected]]
if.app-id = "com.apple.DigitalColorMeter"
run = 'layout floating'

[[on-window-detected]] # fallback
if.during-aerospace-startup = true
run = "move-node-to-workspace 3"

# Safety net when Karabiner is not running: alt-shift-; enters service mode.
[mode.main.binding]
alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
d = ['enable toggle', 'mode main']
