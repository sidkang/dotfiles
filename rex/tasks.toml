["rex:install"]
description = "Install only rex dependencies; no deployment or setup"
run = "brew bundle install --no-upgrade --file=\"{{ config_root }}/rex/Brewfile\""

["rex:plan"]
description = "Preview only rex deployment"
run = "mise dot apply --dry-run \"~/.config/rex/themes\" \"~/.config/rex/server-start.sh\" \"~/Library/LaunchAgents/com.sid.rex-server.plist\" \"~/Library/LaunchAgents/com.sid.rex-server-reload.plist\""

["rex:apply"]
description = "Deploy only rex themes, server start script and LaunchAgents; no installation or settings"
run = "mise dot apply \"~/.config/rex/themes\" \"~/.config/rex/server-start.sh\" \"~/Library/LaunchAgents/com.sid.rex-server.plist\" \"~/Library/LaunchAgents/com.sid.rex-server-reload.plist\""

["rex:settings"]
description = "Apply glacier-preferred Rex appearance, Catppuccin Latte theme, and Remote Control"
run = "python3 \"{{ config_root }}/rex/apply-settings.py\""

["rex:server-start"]
description = "Start the Rex server LaunchAgent if not loaded (does not restart a running server)"
run = "launchctl print \"gui/$(id -u)/com.sid.rex-server\" >/dev/null 2>&1 || launchctl bootstrap \"gui/$(id -u)\" \"$HOME/Library/LaunchAgents/com.sid.rex-server.plist\""

["rex:completions"]
description = "Generate Fish completion for rex into ~/.config/fish/completions; no deployment"
run = "bash \"{{ config_root }}/rex/install-fish-completion.sh\""

