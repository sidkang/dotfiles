["rex:install"]
description = "Install only rex dependencies; no deployment or setup"
run = "brew bundle install --no-upgrade --file=\"{{ config_root }}/rex/Brewfile\""

["rex:plan"]
description = "Preview only rex deployment"
run = "mise dot apply --dry-run \"~/.config/rex/themes\" \"~/.config/rex/init.lua\""

["rex:apply"]
description = "Deploy only rex themes and Lua config; no installation, server, or settings"
run = "mise dot apply \"~/.config/rex/themes\" \"~/.config/rex/init.lua\""

["rex:settings"]
description = "Apply glacier-preferred Rex appearance, Catppuccin Latte theme, and Remote Control"
run = "python3 \"{{ config_root }}/rex/apply-settings.py\""

["rex:completions"]
description = "Generate Fish completion for rex into ~/.config/fish/completions; no deployment"
run = "bash \"{{ config_root }}/rex/install-fish-completion.sh\""

