# Sarasa Term Slab SC with SS17 Latin and Nerd Font icons.
font_family Sarasa Term Slab SS17 SC Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16.0


action_alias launch_tab launch --type=tab --cwd=current
action_alias launch_pane launch --cwd=current --location=split

allow_remote_control yes
shell_integration no-cursor
enabled_layouts splits,stack,tall,grid,fat
macos_option_as_alt both
macos_show_window_title_in none 

macos_traditional_fullscreen no
background_opacity 0.95
scrollback_lines 100000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS --ignore-case +INPUT_LINE_NUMBER
tab_bar_min_tabs 1
hide_window_decorations yes
window_padding_width 3

# Theme
include catppuccin-latte-custom.conf


map cmd+backspace send_text all \x15

map cmd+n launch --type=os-window --cwd=current --add-to-session !
map cmd+t launch --type=tab --cwd=current
map cmd+p launch --type=overlay --allow-remote-control python3 ~/.config/kitty/context_switcher.py

# Navigate between shell prompts
map cmd+up scroll_to_prompt -1
map cmd+down scroll_to_prompt 1
map cmd+w no_op

# window_border_width 1.5pt
# active_border_color #ff9e64
# inactive_border_color #24283b
# inactive_text_alpha 0.9



# Tab bar
tab_bar_style custom
tab_bar_edge top
tab_bar_background none
tab_bar_margin_width 8
tab_bar_margin_height 4 0
tab_separator ""

active_tab_foreground   #eff1f5
active_tab_background   #2d75c7
inactive_tab_foreground #6c6f85
inactive_tab_background #ccd0da
active_tab_font_style   bold
inactive_tab_font_style normal

active_tab_title_template "{fmt.bg._2d75c7}{fmt.fg._eff1f5} {index} {fmt.bg.default}"
tab_title_template        "{fmt.bg.default}{fmt.fg._8c8fa1} {index} "


cursor_shape block
cursor_blink_interval 0.4
cursor_stop_blinking_after 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 3
