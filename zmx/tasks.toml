["zmx:install"]
description = "Install only zmx dependencies; no deployment or setup"
run = "brew bundle install --no-upgrade --file=\"{{ config_root }}/zmx/Brewfile\""

["zmx:plan"]
description = "Preview only zmx deployment"
run = "mise dot apply --dry-run \"~/.config/fish/conf.d/zmx.fish\""

["zmx:apply"]
description = "Deploy only zmx configuration; no installation or setup"
run = "mise dot apply \"~/.config/fish/conf.d/zmx.fish\""
