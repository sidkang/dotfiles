"$schema" = 'https://starship.rs/config-schema.json'

# Active palette — synchronized with kitty/catppuccin-latte-custom.conf.
palette = "catppuccin_latte_custom"
# Official Latte is "catppuccin_latte"; alternatives: "alabaster", "everforest_light", "iceberg_light", "rose_pine_dawn", "dawnfox", "noctis_lux", or "tomorrow_default"

# Module formats own trailing spaces; keep the top-level format delimiter-free.

add_newline = false
format = """
$username$hostname$directory$custom$python$battery$time$line_break\
$character
"""

command_timeout = 1000
scan_timeout = 1000

[battery]
disabled = false
format = "with [$symbol$percentage]($style) "
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂂 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 10
# Catppuccin Latte: style = "bold #d20f39"
style = "bold red"
discharging_symbol = "󰁺 "

[[battery.display]]
threshold = 20
# Catppuccin Latte: style = "bold #dc3f34"
style = "bold red"
discharging_symbol = "󰁻 "

[[battery.display]]
threshold = 30
# Catppuccin Latte: style = "bold #e76e2e"
style = "bold yellow"
discharging_symbol = "󰁼 "

[[battery.display]]
threshold = 40
# Catppuccin Latte: style = "bold #df8e1d"
style = "bold yellow"
discharging_symbol = "󰁽 "

[[battery.display]]
threshold = 50
# Catppuccin Latte: style = "bold #c5a120"
style = "bold yellow"
discharging_symbol = "󰁾 "

[[battery.display]]
threshold = 60
# Catppuccin Latte: style = "bold #a8af23"
style = "bold green"
discharging_symbol = "󰁿 "

[[battery.display]]
threshold = 70
# Catppuccin Latte: style = "bold #40a02b"
style = "bold green"
discharging_symbol = "󰂀 "

[[battery.display]]
threshold = 75
# Catppuccin Latte: style = "bold #40a02b"
style = "bold green"
discharging_symbol = "󰂁 "

[character] # The name of the module we are configuring is "character"
format = "$symbol  "
success_symbol = "[󱞩](bold green)"
error_symbol = "[✖](bold red)"
vimcmd_symbol = "[↖](bold yellow)"
vimcmd_visual_symbol = "[↑](bold blue)"
vimcmd_replace_symbol = "[←](bold purple)"

[docker_context]
disabled = true

[hostname]
ssh_only = true
format = "on [$hostname](bold red) "
# format = '[$ssh_symbol](bold blue) on [$hostname](bold red) '
trim_at = ".companyname.com"
disabled = false

[lua]
disabled = true

[line_break]
disabled = false

[directory]
truncation_length = 5
style = "bold cyan"

[cmd_duration]
disabled = true

[aws]
disabled = true

[python]
symbol = "󰌠"
format = 'via [$symbol $version](yellow)( [\[$virtualenv\]](yellow)) '
python_binary = [["uv", "run", "--no-python-downloads", "python"]]

[time]
disabled = true
format = '[$time]($style)'
# Catppuccin Latte: style = "bold italic #acb0be"
style = "bold italic muted"
time_format = "%H:%M"
# time_format = "%H:%M:%S"
# time_range = "16:00:00-9:00:00"

[package]
disabled = true

[quarto]
disabled = true

[username]
show_always = false
disabled = false
format = "[$user]($style) "

# custom module for jj status
# Keep per-field colors in the jj template; Starship custom modules only style the whole output.
# Nerd Font icons used here:
# - symbol: nf-md-source_branch (󰘬)
# - dirty/non-empty: nf-md-plus_minus_variant (󱓉)
# - conflict: nf-md-alert (󰀦)
# - divergent: nf-md-call_split (󰃻)
# - hidden: nf-md-eye_off (󰈉)
# - immutable: nf-md-lock (󰌾)
[custom.jj]
description = "The current jj status"
when = "d=$PWD; while [ \"$d\" != / ]; do [ -e \"$d/.jj\" ] && exit 0; d=${d%/*}; [ -n \"$d\" ] || d=/; done; exit 1"
shell = ["sh"]
symbol = "󰘬"
format = "on [$symbol](bold purple) $output "
command = '''
jj show @ --no-patch --ignore-working-copy --color always --template '
  separate(" ",
    raw_escape_sequence("\x1b[1;35m") ++ change_id.shortest(4) ++ raw_escape_sequence("\x1b[0m"),
    bookmarks,
    concat(
      if(!empty, raw_escape_sequence("\x1b[33m") ++ "󱓉" ++ raw_escape_sequence("\x1b[0m")),
      if(conflict, "󰀦"),
      if(divergent, "󰃻"),
      if(hidden, "󰈉"),
      if(immutable, "󰌾"),
    ),
    if(
      description,
      raw_escape_sequence("\x1b[1;32m") ++ truncate_end(50, description.first_line(), "…") ++ raw_escape_sequence("\x1b[0m"),
      raw_escape_sequence("\x1b[2m") ++ "(no desc)" ++ raw_escape_sequence("\x1b[0m"),
    ),
  )
'
'''

# Show git modules only outside jj repositories.
[git_status]
disabled = true

[git_commit]
disabled = true

[git_branch]
disabled = true
symbol = "󰘬"
format = "on [$symbol $branch(:$remote_branch)]($style) "

[custom.git]
description = "Show git modules only outside jj repositories"
when = "d=$PWD; while [ \"$d\" != / ]; do [ -e \"$d/.jj\" ] && exit 1; [ -e \"$d/.git\" ] && exit 0; d=${d%/*}; [ -n \"$d\" ] || d=/; done; exit 1"
shell = ["sh"]
format = "$output "
command = "starship module git_branch; starship module git_commit; starship module git_status"

