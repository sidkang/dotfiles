min_version = "2026.10.13"

[task_config]
includes = ["*/tasks.toml"]

[dotfiles]
"~/.config/aerospace" = { source = "aerospace", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
"~/.config/bat" = { source = "bat", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
"~/.config/bottom" = { source = "bottom", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
"~/.config/btop" = { source = "btop", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
"~/.config/fish" = { source = "fish", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
"~/.config/git" = { source = "git", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
"~/.config/hammerspoon" = { source = "hammerspoon", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
"~/.config/hunk/config.toml" = { source = "hunk/config.toml", mode = "symlink" }
# IPYTHONDIR is set in fish; history and other profile state stay local.
"~/.config/ipython/profile_default/ipython_config.py" = { source = "ipython/ipython_config.py", mode = "symlink" }
# Only the global config; jj/repos stays local.
"~/.config/jj/config.toml" = { source = "jj/config.toml", mode = "symlink" }
"~/.config/karabiner.edn" = { source = "goku/karabiner.edn", mode = "symlink" }
"~/.config/kitty" = { source = "kitty", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store", "__pycache__", "research"] }
"~/.config/rex/themes" = { source = "rex/themes", mode = "symlink-each", exclude = [".DS_Store"] }
"~/.config/rex/server-start.sh" = { source = "rex/server-start.sh", mode = "symlink" }
"~/Library/LaunchAgents/com.sid.rex-server.plist" = { source = "rex/com.sid.rex-server.plist", mode = "symlink" }
# mise reads and runs these globally; config.local.toml stays local.
"~/.config/mise/config.toml" = { source = "mise/config.toml", mode = "symlink" }
"~/.config/mise/tasks" = { source = "mise/tasks", mode = "symlink" }
"~/.config/nebula" = { source = "nebula", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store", "glacier.yml"] }
"/opt/homebrew/etc/nebula/config.yml" = { source = "nebula/glacier.yml", mode = "symlink" }
# lazy-lock.json and the uv .venv stay local.
"~/.config/nvim" = { source = "nvim", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store", "readme.md"] }
# Only Lua configuration; Rex client preferences and session state stay local.
"~/.config/rex/init.lua" = { source = "rex/init.lua", mode = "symlink" }
"~/.config/starship.toml" = { source = "starship/starship.toml", mode = "symlink" }
"~/.config/swiftbar" = { source = "swiftbar", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store", "test_*.py", "__pycache__", "secrets.py", "pbcopy", ".venv"] }
# pi (PI_CODING_AGENT_DIR, set in fish): config files are linked one by one so local state
# (auth.json, sessions/, npm/, git/, caches) stays out of the repo.
# AGENTS.md here is pi's global instruction file, so it is deployed.
"~/.config/pi/agent" = { source = "pi/agent", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", ".DS_Store", "/prompts", "/subagent-manager", "/themes"] }
"pi/mcp.json" = { source = "pi/mcp.json", mode = "symlink", variants = [{ os = ["linux", "windows"], target = "~/.config/pi/agent/mcp.json" }] }
"pi/mcp.mac.json" = { source = "pi/mcp.mac.json", mode = "symlink", variants = [{ os = "macos", target = "~/.config/pi/agent/mcp.json" }] }
"~/.config/pi/agent/prompts" = { source = "pi/agent/prompts", mode = "symlink" }
# pi-subagent-manager refuses symlinked state, so this one is copied. Capture its own edits with `mise dot add`.
"~/.config/pi/agent/subagent-manager" = { source = "pi/agent/subagent-manager", mode = "copy", exclude = [".import-offered", ".DS_Store"] }
"~/.config/pi/agent/themes" = { source = "pi/agent/themes", mode = "symlink" }
"~/.config/fish/conf.d/zmx.fish" = { source = "zmx/zmx.fish", mode = "symlink" }
"~/.config/yazi" = { source = "yazi", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
# zjstatus loads from its pinned GitHub release URL; zellij caches it.
"~/.config/zellij" = { source = "zellij", mode = "symlink-each", exclude = ["Brewfile", "tasks.toml", "README.md", "AGENTS.md", ".DS_Store"] }
# Espanso reloads and installs packages inside these directories, so link them whole.
"~/Library/Application Support/espanso/config" = { source = "espanso/config", mode = "symlink" }
"~/Library/Application Support/espanso/match" = { source = "espanso/match", mode = "symlink" }
"~/Library/Application Support/espanso/script" = { source = "espanso/script", mode = "symlink" }

[tasks.check]
description = "Validate tasks and tree/history secrets before publishing"
run = [
  "mise tasks validate",
  "python3 scripts/check-secrets.py",
]
