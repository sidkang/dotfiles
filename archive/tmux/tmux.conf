##### Status / theme: close to the current Zellij zjstatus layout
set -g status-position top
set -g status-left-length 40
set -g status-right-length 80
set -g status-justify left

set -gF status-style "bg=default,fg=#{@latte_text}"
set -gF message-style "bg=default,fg=#{@latte_blue}"
set -gF pane-border-style "fg=#{@latte_surface0}"
set -gF pane-active-border-style "fg=#{@latte_blue}"

setw -g window-status-separator "#[fg=#{@latte_overlay1}] / "
setw -g window-status-format "#[fg=#{@latte_subtext1}]#W#{?pane_synchronized, ↹,}#{?window_zoomed_flag, □,}"
setw -g window-status-current-format "#[fg=#{@latte_sapphire},bold]#W#{?pane_synchronized, ↹,}#{?window_zoomed_flag, □,}"
setw -gF window-status-style "bg=default,fg=#{@latte_subtext0}"
setw -gF window-status-current-style "bg=default,fg=#{@latte_text}"
setw -gF window-status-last-style "bg=default,fg=#{@latte_text}"
setw -gF window-status-bell-style "bg=default,fg=#{@latte_red}"

set -g status-left "#{?pane_in_mode,#[fg=#{@latte_sky}]scroll,#{?client_prefix,#[fg=#{@latte_peach}]prefix,#[fg=#{@latte_red}]locked}}#[fg=#{@latte_overlay1}] • "
set -g status-right "#[fg=#{@latte_overlay1}]• #[fg=#{@latte_rosewater},bold]#S "

##### TPM must stay at the end of the file
run '~/.config/tmux/plugins/tpm/tpm'
