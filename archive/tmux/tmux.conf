##### Plugins
set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

##### Terminal / base behavior
set -g prefix C-b
bind-key C-b send-prefix

set -g extended-keys on
set -g extended-keys-format csi-u

set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -g set-titles on
set -g set-titles-string "tmux: #S | #{?pane_in_mode,scroll,#{?client_prefix,prefix,locked}} | #{W:#{?window_active,*,}#{window_name}#{?window_bell_flag,!,}#{?window_activity_flag,●,}#{?pane_synchronized,↹,}#{?window_zoomed_flag,□,}#{?loop_last_flag,, / },#{?window_active,*,}#{window_name}#{?window_bell_flag,!,}#{?window_activity_flag,●,}#{?pane_synchronized,↹,}#{?window_zoomed_flag,□,}#{?loop_last_flag,, / }}"

set -g mouse on
set -g status-interval 5
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g display-panes-time 1500
set -g focus-events on
set -g set-clipboard on

# When the last pane/window in the current session exits, detach the client
# back to the shell instead of switching to another tmux session.
set -g detach-on-destroy on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-passthrough on
set-window-option -g automatic-rename on
setw -g allow-rename on
setw -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
 bind-key -T copy-mode-vi Escape send-keys -X cancel

##### Key bindings
# Keep pane navigation behind the tmux prefix so it does not fight Neovim.
# Intentionally avoid global C-h/j/k/l and M-h/j/k/l bindings.
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Prefer t/v/s over tmux's default c/%/\" bindings.
unbind-key c
unbind-key %
unbind-key '"'
unbind-key &

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Vim-style split names: v = vertical split, s = horizontal split.
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

bind-key x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind-key z resize-pane -Z

# Treat tmux windows as tabs.
bind-key t new-window -c "#{pane_current_path}"
bind-key H previous-window
bind-key L next-window
bind-key w choose-tree -Zw

# Move the current window left/right. Kept disabled until the workflow feels right.
# bind-key < swap-window -t -1 \; previous-window
# bind-key > swap-window -t +1 \; next-window

