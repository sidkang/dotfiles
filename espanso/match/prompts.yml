matches:
  - trigger: :yts
    replace: |-
      你是一名兼具批判性思维的内容分析专家。请对以下 YouTube 视频进行深度分析，
      目标是让读者在不观看视频的情况下，获得完整且有深度的内容理解。

      视频链接：{{clipboard}}

      ---

      ## 1. 核心定位
      用3-5句话回答：
      - 这个视频解决什么核心问题？
      - 作者的核心立场或主张是什么？
      - 与同类内容相比，这个视频的独特价值在哪里？

      ## 2. 结构化大纲（含时间戳）
      作为第3节的导览骨架，每章节提供：
      - 时间起点
      - 核心论点（作者在这段想证明什么，而非仅描述内容）
      - 与前后段的逻辑关系（承接 / 转折 / 深化 / 总结）

      ## 3. 完整内容重建
      按视频实际推进顺序，以连贯叙述还原完整内容。

      写作规则：
      - 对应第2节的每个章节单独成段，段首注明时间戳
      - 信息分级处理：
        * 核心论点、关键数据、操作步骤 → 完整展开，不得省略
        * 过渡性内容、举例说明 → 保留要点，适度精简
        * 重复强调、填充性内容 → 一句带过
      - 明确区分：「作者主张」vs「引用的外部数据/案例」
      - 写作目标：读者读完等同于完整看完视频，且重点比视频更突出

      字数不设上限，以重点完整为准。

      ## 4. 批判性评估
      - 【核心洞察】1-3个非显而易见、信息密度最高的主张
      - 【论证质量】是否存在逻辑漏洞、未交代的前提、或过度简化？
      - 【延伸资源】视频中提及的工具、书籍、数据来源或参考材料

      ---
      核心优先级：第3节 > 第4节 > 第2节 > 第1节
      若内容有取舍，优先保证高优先级节点的完整性。
    vars:
      - name: clipboard
        type: clipboard
