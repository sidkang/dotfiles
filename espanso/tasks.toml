["espanso:install"]
description = "Install only espanso dependencies; no deployment or setup"
run = "brew bundle install --no-upgrade --file=\"{{ config_root }}/espanso/Brewfile\""

["espanso:plan"]
description = "Preview only espanso deployment"
run = "mise dot apply --dry-run \"~/Library/Application Support/espanso/config\" \"~/Library/Application Support/espanso/match\" \"~/Library/Application Support/espanso/script\""

["espanso:apply"]
description = "Deploy only espanso configuration; no installation or setup"
run = "mise dot apply \"~/Library/Application Support/espanso/config\" \"~/Library/Application Support/espanso/match\" \"~/Library/Application Support/espanso/script\""
